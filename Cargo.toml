[package]
name = "thehome-google-cast"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Chromecast, Google-højttalere og andre Cast-enheder som ekstern integration til TheHome"
publish = false

[[bin]]
name = "google_cast"
path = "src/main.rs"

[dependencies]
thehome-plugin = { git = "https://github.com/magnusdunker/thehome-example-integration-rust", rev = "a8f05c1859f6689b2a31d2188593eb872408385e" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
mdns-sd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
